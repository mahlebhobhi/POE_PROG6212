services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-RaceDay_Local_Only_123!}"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build: ./RaceDay.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceDay: "Server=database,1433;Database=RaceDayDocker;User Id=sa;Password=${MSSQL_SA_PASSWORD:-RaceDay_Local_Only_123!};TrustServerCertificate=True;Encrypt=False"
      Database__EnsureCreated: "true"
      AzureBlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING:-}"
      AzureBlobStorage__ContainerName: "raceday-media"
    depends_on:
      database: { condition: service_healthy }
  mvc:
    build: ./RaceDay.Mvc
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: "http://api:8080/"
    ports: ["8080:8080"]
    depends_on: [api]
